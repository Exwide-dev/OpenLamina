name: CMake Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ==================== 安装 Clang 21.1.7 ====================
    - name: Install Clang 21 (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" -y
        sudo apt-get update
        sudo apt-get install -y clang-21 lld-21
        echo "CC=clang-21" >> $GITHUB_ENV
        echo "CXX=clang++-21" >> $GITHUB_ENV

    - name: Install Clang 21 (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install llvm@21
        echo "/usr/local/opt/llvm@21/bin" >> $GITHUB_PATH
        echo "CC=/usr/local/opt/llvm@21/bin/clang" >> $GITHUB_ENV
        echo "CXX=/usr/local/opt/llvm@21/bin/clang++" >> $GITHUB_ENV

    - name: Install Clang 21 (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install llvm --version=21.1.7 -y
        echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "CC=clang.exe" >> $GITHUB_ENV
        echo "CXX=clang++.exe" >> $GITHUB_ENV

    # ==================== 验证 Clang 版本 ====================
    - name: Verify Clang version
      run: |
        ${{ env.CC }} --version
        ${{ env.CXX }} --version

    # ==================== 安装 Flex 和 Bison ====================
    - name: Install Flex and Bison (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison

    - name: Install Flex and Bison (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install flex bison
        echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH
        echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH

    - name: Install Flex and Bison (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install winflexbison3 -y
        echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # ==================== 配置 CMake ====================
    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DFETCH_LAMMP=ON \
          -DCMAKE_C_COMPILER=${{ env.CC }} \
          -DCMAKE_CXX_COMPILER=${{ env.CXX }}

    # ==================== 构建 ====================
    - name: Build
      shell: bash
      working-directory: ./build
      run: |
        cmake --build . --config ${{ env.BUILD_TYPE }} --parallel

    # ==================== 上传 artifacts ====================
    - name: Upload artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: OpenLamina-windows
        path: build/Release/OpenLamina.exe

    - name: Upload artifacts (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: OpenLamina-linux
        path: build/OpenLamina

    - name: Upload artifacts (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: OpenLamina-macos
        path: build/OpenLamina
