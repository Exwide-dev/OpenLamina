name: CMake Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Ninja (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Install latest Clang (Linux/Windows)
      if: runner.os != 'macOS'
      uses: egor-tensin/setup-clang@v2
      with:
        version: latest

    - name: Install latest Clang (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm ninja
        echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

    - name: Configure CMake
      shell: bash
      run: |
        EXTRA_CXX_FLAGS=""
        if [[ "${{ runner.os }}" != "Windows" ]]; then
          EXTRA_CXX_FLAGS="-fexperimental-library"
        fi
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
          -DFETCH_LAMMP=ON \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_STANDARD=23 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON \
          -DCMAKE_CXX_EXTENSIONS=OFF \
          -DCMAKE_CXX_FLAGS="${EXTRA_CXX_FLAGS}"

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Upload artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: OpenLamina-windows
        path: build/OpenLamina.exe

    - name: Upload artifacts (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: OpenLamina-linux
        path: build/OpenLamina

    - name: Upload artifacts (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: OpenLamina-macos
        path: build/OpenLamina
