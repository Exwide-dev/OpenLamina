name: CMake Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ==================== 设置编译器为 Clang ====================
    - name: Set compiler (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y clang

    - name: Set compiler (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV

    - name: Set compiler (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "CC=clang-cl" >> $GITHUB_ENV
        echo "CXX=clang-cl" >> $GITHUB_ENV

    # ==================== 安装 Flex 和 Bison ====================
    - name: Install Flex and Bison (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison

    - name: Install Flex and Bison (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install flex bison
        echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH
        echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH

    - name: Install Flex and Bison (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install winflexbison3 -y
        echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # ==================== 配置 CMake ====================
    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DFETCH_LAMMP=ON \
          -DCMAKE_C_COMPILER=${{ env.CC }} \
          -DCMAKE_CXX_COMPILER=${{ env.CXX }}

    # ==================== 构建 ====================
    - name: Build
      shell: bash
      working-directory: ./build
      run: |
        cmake --build . --config ${{ env.BUILD_TYPE }} --parallel

    # ==================== 上传 artifacts ====================
    - name: Upload artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: OpenLamina-windows
        path: build/Release/OpenLamina.exe

    - name: Upload artifacts (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: OpenLamina-linux
        path: build/OpenLamina

    - name: Upload artifacts (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: OpenLamina-macos
        path: build/OpenLamina
